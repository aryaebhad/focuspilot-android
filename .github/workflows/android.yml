name: Build FocusPilot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare placeholder
        run: |
          echo "Android project files will be added next."
          mkdir -p output
          echo "Build setup ready" > output/status.txt

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: focuspilot-build-status
          path: output/status.txt
